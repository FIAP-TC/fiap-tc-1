name: Deploy da aplicação

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docker/**"
      - "k8s/**"
      - "routes/**"
      - "database/**"
      - "composer.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fiap_mecanica
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, zip, pdo, pdo_mysql
          coverage: none

      - name: Cache de dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar migrations
        run: php artisan migrate --force

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, zip, pdo, pdo_mysql
          coverage: none

      - name: Cache de dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes unitários (PHPUnit)
        run: vendor/bin/phpunit --testsuite=Unit

  phpstan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, zip, pdo, pdo_mysql
          coverage: none

      - name: Cache de dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Análise estática (PHPStan)
        run: vendor/bin/phpstan analyse --level=0

  build-and-push:
    needs: [unit-tests, phpstan]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar tag a partir do commit
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx (build multi-plataforma)
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fmp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: elmarcelfarias/php8.3-fpm-alpine:${{ steps.vars.outputs.tag }}

      - name: Build + push da imagem do Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: elmarcelfarias/nginx-fiap-tc-1:${{ steps.vars.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Instalar kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Atualizar kubeconfig
        run: aws eks update-kubeconfig --name eks-fiap-tc-1-terraform-backend --region us-east-1

      - name: Gerar o Secret da aplicação
        run: |
          kubectl create secret generic app-secret \
            --namespace=fiap-tc-1 \
            --from-literal=DB_DATABASE="${{ secrets.SECRET_DB_DATABASE }}" \
            --from-literal=DB_USERNAME="${{ secrets.SECRET_DB_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.SECRET_DB_PASSWORD }}" \
            --from-literal=DB_ROOT_PASSWORD="${{ secrets.SECRET_DB_ROOT_PASSWORD }}" \
            --from-literal=APP_KEY="${{ secrets.SECRET_APP_KEY }}" \
            --from-literal=JWT_SECRET="${{ secrets.SECRET_JWT_SECRET }}" \
            --from-literal=APPROVAL_SECRET="${{ secrets.SECRET_APPROVAL_SECRET }}" \
            --dry-run=client -o yaml > k8s/base/02-secret.yaml

      - name: Definir a tag da imagem no overlay da AWS
        working-directory: k8s/overlays/aws
        run: |
          kustomize edit set image elmarcelfarias/php8.3-fpm-alpine=elmarcelfarias/php8.3-fpm-alpine:${{ needs.build-and-push.outputs.tag }}
          kustomize edit set image elmarcelfarias/nginx-fiap-tc-1=elmarcelfarias/nginx-fiap-tc-1:${{ needs.build-and-push.outputs.tag }}

      - name: Remover Job de migration anterior (se existir)
        run: kubectl delete job api-migrate -n fiap-tc-1 --ignore-not-found=true

      - name: Aplicar no cluster
        run: kubectl apply -k k8s/overlays/aws
