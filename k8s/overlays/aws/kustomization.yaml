apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: delete-mysql-deployment.yaml
  - path: delete-mysql-service.yaml
  - path: delete-mysql-pvc.yaml
  - path: patch-migrate-wait.yaml
  - path: patch-nginx-lb.yaml

configMapGenerator:
  - name: app-config
    namespace: fiap-tc-1
    behavior: merge
    envs:
      - db-host.env
