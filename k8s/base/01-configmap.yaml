apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fiap-tc-1
data:
  APP_NAME: "mecanica"
  APP_ENV: "local"
  APP_DEBUG: "true"
  APP_URL: "http://localhost"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "dev"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  JWT_TTL: "60"
  JWT_BLACKLIST_ENABLED: "true"
  CACHE_DRIVER: "file"
  MAIL_MAILER: "smtp"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: "no-reply@mecanica.local"
  MAIL_FROM_NAME: "mecanica"
