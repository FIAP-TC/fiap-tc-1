apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: fiap-tc-1
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              until nc -z mysql 3306 || [ $i -ge 30 ]; do
                i=$((i+1))
                echo "aguardando o MySQL... ($i/30)"
                sleep 2
              done
              nc -z mysql 3306 || (echo "MySQL nao ficou disponivel a tempo" && exit 1)
      containers:
        - name: migrate
          image: elmarcelfarias/php8.3-fpm-alpine:1.2
          command: ["php", "artisan", "migrate", "--seed", "--force"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
